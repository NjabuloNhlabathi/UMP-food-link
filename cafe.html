<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLink - Staff Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="app-container">

    <!-- ========== NAVIGATION ========== -->
    <nav class="nav-neumorphic">
        <div class="nav-brand">
            <span class="brand-icon">🍽️</span>
            <span class="brand-text">FoodLink</span>
        </div>
        <div class="nav-links">
            <a href="homepage.html">🏠 Home</a>
            <a href="student.html">👨‍🎓 Students <span class="badge-count" id="availBadge">0</span></a>
            <a href="cafe.html" class="active">👨‍🍳 Staff</a>
        </div>
    </nav>

    <!-- ========== DASHBOARD HEADER ========== -->
    <div class="dashboard-header">
        <div>
            <h1 class="display-text" style="font-size:32px;">👨‍🍳 Kitchen Staff Dashboard</h1>
            <p class="body-md" style="color: var(--on-surface-variant);">Manage surplus food & get AI recommendations</p>
        </div>
    </div>

    <!-- ========== TWO-COLUMN LAYOUT ========== -->
    <div class="staff-layout">
        
        <!-- LEFT: Add Food & AI Analyzer -->
        <div class="staff-left">
            
            <!-- Add Food Card -->
            <div class="card-neumorphic">
                <h3 class="headline-md" style="margin-bottom:16px;">➕ Add New Surplus</h3>
                
                <div class="form-group-neumorphic">
                    <label class="label-caps">Food Name</label>
                    <input id="foodName" class="input-neumorphic" placeholder="e.g. Nasi Lemak" />
                </div>
                
                <div class="form-group-neumorphic">
                    <label class="label-caps">Category</label>
                    <select id="foodCategory" class="input-neumorphic">
                        <option value="cooked_meal">Cooked Meal</option>
                        <option value="raw_veg">Raw Veg/Fruit</option>
                        <option value="meat_seafood">Meat/Seafood</option>
                        <option value="dairy_bread">Dairy/Bread</option>
                        <option value="liquid_oil">Liquid/Oil</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group-neumorphic" style="flex:1;">
                        <label class="label-caps">Quantity (kg)</label>
                        <input id="foodQty" class="input-neumorphic" type="number" value="2.5" step="0.1" />
                    </div>
                    <div class="form-group-neumorphic" style="flex:2;">
                        <label class="label-caps">Expiry / Available Until</label>
                        <input id="foodExpiry" class="input-neumorphic" type="datetime-local" />
                    </div>
                </div>
                
                <button class="btn-primary-neumorphic" onclick="addFoodItem()" style="width:100%;">
                    ➕ Add to Surplus
                </button>
            </div>
            
            <!-- AI Analyzer Card -->
            <div class="card-neumorphic" style="border-top: 3px solid var(--tertiary);">
                <h3 class="headline-md" style="margin-bottom:8px;">🧠 AI Surplus Analyzer</h3>
                <p class="body-md" style="color: var(--on-surface-variant); margin-bottom:16px;">
                    Scan all surplus items and get EPA-aligned recommendations.
                </p>
                <button class="btn-warning-neumorphic" onclick="runStaffAI()" style="width:100%;">
                    🧠 Analyze All Surplus
                </button>
                <div id="staffAIResult" class="result-box-neumorphic"></div>
            </div>
            
        </div>
        
        <!-- RIGHT: Inventory -->
        <div class="staff-right">
            <div class="card-neumorphic">
                <h3 class="headline-md" style="margin-bottom:16px;">📦 Inventory</h3>
                <div id="staffInventoryList" class="inventory-list">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
        
    </div>

</div>

<script src="js/ai-utils.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
